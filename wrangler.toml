name = "whatsapp-mcp-license-worker"
main = "src/worker.js"
compatibility_date = "2024-12-01"
keep_vars = true
# Este worker só tem handler de email — não existe rota HTTP para expor, e
# publicar em workers.dev só criaria uma URL pública inútil.
workers_dev = false

# Nada aqui é segredo: o worker só clica em links que chegam por e-mail para
# endereços que ele reconhece. As variáveis dizem quais endereços são dele e
# para onde vai o resto do correio.

[vars]
# Quais destinatários pertencem ao WhatsApp MCP. Padrão: a forma plus-addressed
# que o painel registra (whatsappmcp+<id>@example.com) — uma regra exata
# `whatsappmcp` no Email Routing casa com todos os `+detalhe`, então não é
# preciso catch-all para nada chegar aqui.
# RECIPIENT_REGEX = "^whatsappmcp\\+[a-z0-9-]+@example\\.com$"

# Onde procurar os links de ativação. Padrão: o servidor de licenças da
# Evolution Foundation.
# LINK_REGEX = "https://license\\.evolutionfoundation\\.com\\.br[^\\s\"'<>\\\\]*"

# Fallback opcional, só se um catch-all também rotear para este worker: mail
# que não é do WhatsApp MCP é encaminhado aqui para não sumir.
# FALLBACK_ADDRESS = "you@example.com"
