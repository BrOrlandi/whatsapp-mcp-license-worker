name = "whatsapp-mcp-license-worker"
main = "src/worker.js"
compatibility_date = "2024-12-01"
keep_vars = true
# Este worker só tem handler de email — não existe rota HTTP para expor, e
# publicar em workers.dev só criaria uma URL pública inútil.
workers_dev = false

# Sem isto o Cloudflare não guarda os console.log/exceções: um e-mail que
# falha às 3h vira só um contador de erro, sem o motivo.
[observability]
enabled = true

# As variáveis do worker NÃO ficam aqui. Elas dizem qual é o domínio do
# operador — não são segredo, mas não pertencem a um repositório público, e
# um valor commitado aqui viraria o default de quem clonar o projeto.
#
# Ficam no .env (git-ignorado, modelo em .env.example) e chegam ao worker via
# `npm run deploy`, que as repassa como --var. O `keep_vars = true` acima é o
# que faz elas sobreviverem a um `wrangler deploy` feito sem o script.
#
# Para `wrangler dev`, o wrangler lê .dev.vars sozinho.
