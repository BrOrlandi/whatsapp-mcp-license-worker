name = "whatsapp-mcp-license-worker"
main = "src/worker.js"
compatibility_date = "2024-12-01"
keep_vars = true

# Nada aqui é segredo: o worker só clica em links que chegam por e-mail para
# endereços que ele reconhece. As variáveis dizem quais endereços são dele e
# para onde vai o resto do correio.

[vars]
# Quais destinatários pertencem ao WhatsApp MCP. Padrão: o domínio
# example.com. O painel registra licenças como whatsappmcp-<id>@domínio.
# RECIPIENT_REGEX = "^whatsappmcp-[a-z0-9-]+@example\\.com$"

# Onde procurar os links de ativação. Padrão: o servidor de licenças da
# Evolution Foundation.
# LINK_REGEX = "https://license\\.evolutionfoundation\\.com\\.br[^\\s\"'<>\\\\]*"

# Se o worker estiver atrás de uma regra catch-all, endereça aqui o destino
# do correio que não é do WhatsApp MCP, para nada pessoal sumir.
# FALLBACK_ADDRESS = "you@example.com"
